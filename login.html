<!DOCTYPE html>
<html lang="es">
<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Acceso privado | JÚ MORALES</title>

    <link
        href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Playfair+Display:ital,wght@0,400;0,500;0,600;1,400&display=swap"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="styles.css"
    >

    <style>

    body {
        min-height: 100vh;

        display: flex;
        align-items: center;
        justify-content: center;

        background:
            radial-gradient(
                circle at top left,
                rgba(241, 223, 225, 0.8),
                transparent 35%
            ),
            linear-gradient(
                135deg,
                #fbf7f1 0%,
                #f7f1e8 55%,
                #f1dfe1 100%
            );

        color: var(--brown);
    }

    .login-page {
        width: min(450px, calc(100% - 40px));
    }

    .login-card {
        background: rgba(255, 253, 251, 0.96);
        color: var(--brown);

        padding: 55px 45px;

        border: 1px solid var(--line);

        border-radius: 24px;

        box-shadow:
            0 25px 70px rgba(91, 63, 60, 0.12);

        backdrop-filter: blur(12px);
    }

    .login-brand {
        text-align: center;
        margin-bottom: 45px;
    }

    .login-brand strong {
        display: block;

        font-family: var(--serif);

        font-size: 52px;

        font-weight: 400;

        line-height: 1;

        color: var(--brown);
    }

    .login-brand span {
        display: block;

        margin-top: 10px;

        color: var(--pink-dark);

        font-size: 9px;

        letter-spacing: 3px;

        text-transform: uppercase;
    }

    .login-title {
        font-family: var(--serif);

        font-size: 32px;

        font-weight: 400;

        margin-bottom: 8px;

        color: var(--brown);
    }

    .login-description {
        color: var(--brown-light);

        font-size: 12px;

        margin-bottom: 35px;
    }

    .login-group {
        margin-bottom: 24px;
    }

    .login-group label {
        display: block;

        color: var(--brown-light);

        font-size: 9px;

        letter-spacing: 1.5px;

        text-transform: uppercase;

        margin-bottom: 9px;
    }

    .login-group input {
        width: 100%;

        padding: 14px 13px;

        border: 1px solid var(--line);

        outline: none;

        background: var(--cream);

        color: var(--brown);

        border-radius: 10px;

        box-sizing: border-box;

        transition: 0.3s ease;
    }

    .login-group input::placeholder {
        color: #b7aaa4;
    }

    .login-group input:focus {
        border-color: var(--pink);

        background: white;

        box-shadow:
            0 0 0 3px rgba(217, 167, 174, 0.12);
    }

    .login-button {
        width: 100%;

        padding: 16px;

        margin-top: 10px;

        border: 1px solid var(--pink);

        border-radius: 12px;

        background: var(--pink);

        color: white;

        font-size: 10px;

        letter-spacing: 2px;

        text-transform: uppercase;

        cursor: pointer;

        transition: 0.3s ease;
    }

    .login-button:hover {
        background: var(--pink-dark);

        border-color: var(--pink-dark);

        transform: translateY(-1px);
    }

    .login-button:disabled {
        opacity: 0.5;

        cursor: not-allowed;

        transform: none;
    }

    .login-message {
        min-height: 20px;

        margin-top: 18px;

        text-align: center;

        font-size: 11px;

        color: var(--brown-light);
    }

    .back-home {
        display: block;

        margin-top: 25px;

        text-align: center;

        color: var(--brown-light);

        font-size: 10px;

        letter-spacing: 1px;

        text-transform: uppercase;

        transition: 0.3s ease;
    }

    .back-home:hover {
        color: var(--pink-dark);
    }

    @media (max-width: 600px) {

        .login-card {
            padding: 40px 25px;
            border-radius: 20px;
        }

        .login-brand strong {
            font-size: 45px;
        }

    }

</style>

</head>


<body>

    <main class="login-page">

        <section class="login-card">

            <div class="login-brand">

                <strong>JÚ</strong>

                <span>
                    Beauty Studio
                </span>

            </div>


            <h1 class="login-title">
                Acceso privado
            </h1>

            <p class="login-description">
                Panel exclusivo para la administración
                de JÚ MORALES.
            </p>


            <form id="loginForm">

                <div class="login-group">

                    <label for="email">
                        Correo electrónico
                    </label>

                    <input
                        type="email"
                        id="email"
                        autocomplete="email"
                        placeholder="correo@ejemplo.com"
                        required
                    >

                </div>


                <div class="login-group">

                    <label for="password">
                        Contraseña
                    </label>

                    <input
                        type="password"
                        id="password"
                        autocomplete="current-password"
                        placeholder="••••••••"
                        required
                    >

                </div>


                <button
                    type="submit"
                    class="login-button"
                    id="loginButton"
                >
                    Entrar al panel
                </button>


                <p
                    id="loginMessage"
                    class="login-message"
                ></p>

            </form>


            <a
                href="index.html"
                class="back-home"
            >
                ← Volver al sitio
            </a>

        </section>

    </main>


    <!-- Supabase -->

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script src="supabase.js"></script>

    <script src="login.js"></script>

</body>
</html>
