<!DOCTYPE html>
<html lang="es">
<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Acceso privado | JÚ MORALES</title>

    <link
        href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Playfair+Display:ital,wght@0,400;0,500;0,600;1,400&display=swap"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="styles.css"
    >

    <style>

        body {
            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;

            background:
                linear-gradient(
                    rgba(244, 240, 233, 0.91),
                    rgba(244, 240, 233, 0.91)
                ),
                url("https://images.unsplash.com/photo-1522337360788-8b13dee7a37e?auto=format&fit=crop&w=1600&q=85")
                center / cover;
        }

        .login-page {
            width: min(450px, calc(100% - 40px));
        }

        .login-card {
            background: var(--black);
            color: var(--white);

            padding: 55px 45px;

            border: 1px solid #393734;

            box-shadow:
                0 30px 80px rgba(0, 0, 0, 0.18);
        }

        .login-brand {
            text-align: center;

            margin-bottom: 45px;
        }

        .login-brand strong {
            display: block;

            font-family: var(--serif);

            font-size: 52px;

            font-weight: 400;

            line-height: 1;
        }

        .login-brand span {
            display: block;

            margin-top: 10px;

            color: #aaa49b;

            font-size: 9px;

            letter-spacing: 3px;

            text-transform: uppercase;
        }

        .login-title {
            font-family: var(--serif);

            font-size: 32px;

            font-weight: 400;

            margin-bottom: 8px;
        }

        .login-description {
            color: #88847e;

            font-size: 12px;

            margin-bottom: 35px;
        }

        .login-group {
            margin-bottom: 24px;
        }

        .login-group label {
            display: block;

            color: #aaa49b;

            font-size: 9px;

            letter-spacing: 1.5px;

            text-transform: uppercase;

            margin-bottom: 9px;
        }

        .login-group input {
            width: 100%;

            padding: 14px 0;

            border: 0;

            border-bottom: 1px solid #4a4742;

            outline: none;

            background: transparent;

            color: white;

            border-radius: 0;
        }

        .login-group input::placeholder {
            color: #68645f;
        }

        .login-group input:focus {
            border-color: white;
        }

        .login-button {
            width: 100%;

            padding: 17px;

            margin-top: 10px;

            border: 1px solid white;

            background: white;

            color: var(--black);

            font-size: 10px;

            letter-spacing: 2px;

            text-transform: uppercase;

            transition: 0.3s ease;
        }

        .login-button:hover {
            background: transparent;

            color: white;
        }

        .login-button:disabled {
            opacity: 0.5;

            cursor: not-allowed;
        }

        .login-message {
            min-height: 20px;

            margin-top: 18px;

            text-align: center;

            font-size: 11px;
        }

        .back-home {
            display: block;

            margin-top: 25px;

            text-align: center;

            color: #77736d;

            font-size: 10px;

            letter-spacing: 1px;

            text-transform: uppercase;
        }

        .back-home:hover {
            color: white;
        }

        @media (max-width: 600px) {

            .login-card {
                padding: 40px 25px;
            }

            .login-brand strong {
                font-size: 45px;
            }

        }

    </style>

</head>


<body>

    <main class="login-page">

        <section class="login-card">

            <div class="login-brand">

                <strong>JÚ</strong>

                <span>
                    Beauty Studio
                </span>

            </div>


            <h1 class="login-title">
                Acceso privado
            </h1>

            <p class="login-description">
                Panel exclusivo para la administración
                de JÚ MORALES.
            </p>


            <form id="loginForm">

                <div class="login-group">

                    <label for="email">
                        Correo electrónico
                    </label>

                    <input
                        type="email"
                        id="email"
                        autocomplete="email"
                        placeholder="correo@ejemplo.com"
                        required
                    >

                </div>


                <div class="login-group">

                    <label for="password">
                        Contraseña
                    </label>

                    <input
                        type="password"
                        id="password"
                        autocomplete="current-password"
                        placeholder="••••••••"
                        required
                    >

                </div>


                <button
                    type="submit"
                    class="login-button"
                    id="loginButton"
                >
                    Entrar al panel
                </button>


                <p
                    id="loginMessage"
                    class="login-message"
                ></p>

            </form>


            <a
                href="index.html"
                class="back-home"
            >
                ← Volver al sitio
            </a>

        </section>

    </main>


    <!-- Supabase -->

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script src="supabase.js"></script>

    <script src="login.js"></script>

</body>
</html>
